<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Minimalist Studio Clock</title>
  <style>
    :root {
      --bg: #ffffff;
      --clock-bg: #f8f9fa;
      --border: #e9ecef;
      --hand-main: #1a1a1a;
      --hand-second: #bc473b; /* Premium quiet studio red */
    }
    [data-theme="dark"] {
      --bg: #191919;
      --clock-bg: #222222;
      --border: #2e2e2e;
      --hand-main: #ffffff;
      --hand-second: #ef4444;
    }
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.3s;
      overflow: hidden;
    }
    .toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      padding: 6px 10px;
      font-size: 14px;
      background-color: var(--clock-bg);
      color: var(--hand-main);
      transition: all 0.3s;
      z-index: 10;
    }
    .clock {
      width: 190px;
      height: 190px;
      background-color: var(--clock-bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }
    /* Minimalist Hour Dashes around the dial rim */
    .ticks {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .tick {
      position: absolute;
      width: 2px;
      height: 6px;
      background: var(--border);
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      margin-left: -1px;
    }
    /* Master hand placement mechanics */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
      z-index: 2;
    }
    .hour {
      width: 4.5px;
      height: 48px;
      background: var(--hand-main);
      margin-left: -2.25px;
    }
    .minute {
      width: 3px;
      height: 70px;
      background: var(--hand-main);
      margin-left: -1.5px;
    }
    /* Gliding continuous second arm */
    .second {
      width: 1.5px;
      height: 76px;
      background: var(--hand-second);
      margin-left: -0.75px;
      z-index: 3;
    }
    .center-pin {
      width: 6px;
      height: 6px;
      background: var(--hand-main);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 4;
    }
  </style>
</head>
<body>

  <button class="toggle-btn" id="themeToggle">🌙</button>

  <div class="clock">
    <div class="ticks" id="ticks"></div>
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="center-pin"></div>
  </div>

  <script>
    // --- 1. MEMORY THEME MANAGEMENT ---
    const toggleBtn = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('notion-studio-clock-theme') || 'dark';
    
    document.body.setAttribute('data-theme', savedTheme);
    toggleBtn.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

    toggleBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.body.setAttribute('data-theme', newTheme);
      toggleBtn.textContent = newTheme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('notion-studio-clock-theme', newTheme);
    });

    // --- 2. GENERATE THE DIAL TICK DASHES ---
    const ticksContainer = document.getElementById('ticks');
    for (let i = 0; i < 12; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick';
      // Space ticks perfectly around the inner perimeter
      tick.style.transform = `rotate(${i * 30}deg) translateY(-84px)`;
      ticksContainer.appendChild(tick);
    }

    // --- 3. HIGH-PERFORMANCE SMOOTH CLOCK ENGINE ---
    function runClock() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;
      const m = now.getMinutes() + s / 60;
      const h = now.getHours() + m / 60;

      // Translate accurate timeline sweeps into smooth continuous degree shifts
      document.getElementById('second').style.transform = `rotate(${s * 6}deg)`;
      document.getElementById('minute').style.transform = `rotate(${m * 6}deg)`;
      document.getElementById('hour').style.transform = `rotate(${(h % 12) * 30}deg)`;

      // Request next animation frame loops smoothly up to 60fps instead of blocky 1-second interval jumps
      requestAnimationFrame(runClock);
    }
    
    // Fire engine
    requestAnimationFrame(runClock);
  </script>
</body>
</html>
