<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Flip Clock for Notion</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f4f4f5;
      --text: #18181b;
      --border: #e4e4e7;
    }
    [data-theme="dark"] {
      --bg: #191919;
      --card-bg: #202020;
      --text: #ffffff;
      --border: #2f2f2f;
    }
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.3s;
      overflow: hidden;
    }
    .toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      padding: 6px 10px;
      font-size: 14px;
      background-color: var(--card-bg);
      transition: all 0.3s;
      z-index: 10;
    }
    .clock-container {
      display: flex;
      gap: 12px;
    }
    .flip-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 48px;
      font-weight: 700;
      padding: 15px 20px;
      border-radius: 12px;
      min-width: 60px;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .flip-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: var(--border);
    }
    .labels {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
      opacity: 0.4;
      margin-top: 8px;
      text-align: center;
    }
    .card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <button class="toggle-btn" id="themeToggle">🌙</button>
  <div class="clock-container">
    <div class="card-wrapper">
      <div class="flip-card" id="hours">00</div>
      <div class="labels">HR</div>
    </div>
    <div class="card-wrapper">
      <div class="flip-card" id="minutes">00</div>
      <div class="labels">MIN</div>
    </div>
    <div class="card-wrapper">
      <div class="flip-card" id="seconds">00</div>
      <div class="labels">SEC</div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('themeToggle');
    toggleBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      toggleBtn.textContent = isDark ? '🌙' : '☀️';
    });

    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('hours').textContent = hrs;
      document.getElementById('minutes').textContent = mins;
      document.getElementById('seconds').textContent = secs;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
